services:
  nginx:
    image: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  app:
    build: .
    restart: always
    environment:
      - PORT=3000
      - MONGO_URL=mongodb://db:27017
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mongo:8.0.11
    restart: always
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD" , "mongosh" , "--eval" , "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
